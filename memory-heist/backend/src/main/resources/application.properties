spring.application.name=memory-heist-backend
server.port=8080

# MongoDB Configuration (defaults to local MongoDB instance on port 27017)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/memory_heist}

# CORS Allowed Origins (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logging
logging.level.com.memoryheist=INFO
